name: OpenFox Build

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build-linux:
    name: 🐧 Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 480

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang lld llvm nasm yasm \
            nodejs npm python3-pip python3-venv \
            libasound2-dev libcurl4-openssl-dev libdbus-glib-1-dev \
            libdrm-dev libgtk-3-dev libpulse-dev \
            libx11-xcb-dev libxt-dev libglib2.0-dev \
            libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libfontconfig-dev libxcomposite-dev libxdamage-dev \
            libxrandr-dev libxext-dev libxfixes-dev libxrender-dev \
            libxi-dev libxinerama-dev libxss-dev \
            libxxf86vm-dev libxkbcommon-dev libwayland-dev \
            libgbm-dev libpci-dev libelf-dev libva-dev libvulkan-dev \
            wget git m4 xvfb ccache pkg-config autoconf2.13 \
            unzip zip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply OpenFox patches
        run: bash scripts/apply-patches.sh

      - name: Write mozconfig
        run: |
          cat > mozconfig << 'EOF'
          ac_add_options --enable-application=browser
          ac_add_options --enable-optimize
          ac_add_options --enable-release
          ac_add_options --disable-crashreporter
          ac_add_options --disable-updater
          ac_add_options --disable-eme
          ac_add_options --with-branding=browser/branding/openfox
          ac_add_options --disable-tests
          ac_add_options --disable-install-strip
          ac_add_options --without-wasm-sandboxed-libraries
          mk_add_options MOZ_MAKE_FLAGS="-j$(nproc)"
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-openfox
          mk_add_options AUTOCONF=/usr/bin/autoconf2.13
          export CC=clang
          export CXX=clang++
          EOF

      - name: Build
        run: |
          ./mach --no-interactive build

      - name: Package
        if: success()
        run: ./mach package

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openfox-linux-x86_64
          path: obj-openfox/dist/openfox*.tar.bz2

  build-windows:
    name: 🪟 Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 480

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply patches
        shell: bash
        run: bash scripts/apply-patches.sh

      - name: Write mozconfig
        shell: bash
        run: |
          cat > mozconfig << 'EOF'
          ac_add_options --enable-application=browser
          ac_add_options --enable-optimize
          ac_add_options --enable-release
          ac_add_options --disable-crashreporter
          ac_add_options --disable-updater
          ac_add_options --disable-eme
          ac_add_options --with-branding=browser/branding/openfox
          ac_add_options --disable-tests
          ac_add_options --disable-install-strip
          mk_add_options MOZ_MAKE_FLAGS="-j2"
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-openfox
          EOF

      - name: Build
        shell: cmd
        run: |
          python mach --no-interactive build

      - name: Package
        if: success()
        shell: cmd
        run: python mach package

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openfox-windows-x86_64
          path: obj-openfox/dist/openfox*.exe

  build-macos:
    name: 🍎 macOS x86_64
    runs-on: macos-13
    timeout-minutes: 480

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          brew install autoconf@2.13 gawk ccache llvm yasm nasm

      - name: Apply patches
        run: bash scripts/apply-patches.sh

      - name: Write mozconfig
        run: |
          cat > mozconfig << 'EOF'
          ac_add_options --enable-application=browser
          ac_add_options --enable-optimize
          ac_add_options --enable-release
          ac_add_options --disable-crashreporter
          ac_add_options --disable-updater
          ac_add_options --disable-eme
          ac_add_options --with-branding=browser/branding/openfox
          ac_add_options --disable-tests
          ac_add_options --disable-install-strip
          mk_add_options MOZ_MAKE_FLAGS="-j3"
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-openfox
          mk_add_options AUTOCONF=/usr/local/opt/autoconf@2.13/bin/autoconf213
          export CC=clang
          export CXX=clang++
          EOF

      - name: Build
        run: |
          export PATH="/usr/local/opt/llvm/bin:$HOME/.cargo/bin:$PATH"
          ./mach --no-interactive build

      - name: Package
        if: success()
        run: |
          export PATH="/usr/local/opt/llvm/bin:$HOME/.cargo/bin:$PATH"
          ./mach package

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openfox-macos-x86_64
          path: obj-openfox/dist/openfox*.dmg

  release:
    name: 📦 Publish Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.tar.bz2
            artifacts/**/*.exe
            artifacts/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
